name: Pocket Shelf checks

on:
  push:
    branches: [codex/pocket-shelf]
  pull_request:
    paths:
      - contrib/pocket-shelf/**
      - src/platform/pocket-shelf/**
      - src/platform/switch/**
      - src/feature/gui/gui-runner.*
      - CMakeLists.txt
      - CMakePresets.json
      - .github/workflows/pocket-shelf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contrib/pocket-shelf/preview/package-lock.json
      - run: npm ci
        working-directory: contrib/pocket-shelf/preview
      - run: npm test
        working-directory: contrib/pocket-shelf/preview
  native-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake libsdl2-dev libgl1-mesa-dev libfreetype6-dev libpng-dev pkg-config
      - run: cmake --preset pocket-linux-debug
      - run: cmake --build --preset pocket-linux-debug --parallel 2
      - run: ctest --test-dir build-pocket-linux/pocket-shelf --output-on-failure
  switch-build:
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:20260219@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
      - name: Trust this checkout for source revision metadata
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: cmake --preset pocket-switch
      - run: cmake --build --preset pocket-switch --parallel 2
      - run: python3 contrib/pocket-shelf/tools/package-switch.py build-pocket-switch/switch/mgba.nro dist/pocket-shelf
      - uses: actions/upload-artifact@v4
        with:
          name: mgba-pocket-shelf-switch
          path: dist/pocket-shelf/
